<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">GGUF Switchboard logo for dark backgrounds</title>
  <desc id="desc">The GGUF Switchboard routing mark with its wordmark.</desc>
  <defs>
    <linearGradient id="ring" x1="42" y1="54" x2="278" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(130 106) rotate(52) scale(218)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152957"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
  </defs>
  <g transform="translate(20 0)">
    <circle cx="160" cy="160" r="138" fill="url(#ring)"/>
    <circle cx="160" cy="160" r="116" fill="url(#core)" stroke="#bdefff" stroke-opacity="0.72" stroke-width="5"/>
    <g fill="none" stroke="#eefcff" stroke-linecap="round" stroke-linejoin="round" stroke-width="15">
      <path d="M88 160h54m23-11 45-45m-45 68 45 45"/>
    </g>
    <g fill="#eefcff" stroke="url(#ring)" stroke-width="7">
      <circle cx="82" cy="160" r="18"/>
      <circle cx="157" cy="160" r="20"/>
      <circle cx="224" cy="93" r="18"/>
      <circle cx="224" cy="227" r="18"/>
    </g>
  </g>
  <text x="350" y="188" fill="#eefcff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="800" letter-spacing="-3">GGUF Switchboard</text>
</svg>
