# Release (macOS legs) — builds x86_64/aarch64 macOS binaries natively on a
# Mac Woodpecker agent and publishes them to the GitHub Release for the
# pushed tag. Companion to release-linux.yml (see that file's header for how
# the two pipelines coordinate on one shared GitHub Release without sharing
# a workspace).
#
# THIS FILE IS UNVERIFIED — I don't have a live Mac Woodpecker agent to test
# against. It assumes:
#   - The Mac agent runs Woodpecker's exec backend (WOODPECKER_BACKEND=exec),
#     which is why steps below have no `image:` — exec-backend steps run
#     `commands` directly on the host shell, not in a container.
#   - `platform: darwin/arm64` is the label your agent advertises. Adjust if
#     you registered it differently (check the agent's WOODPECKER_PLATFORM
#     or the value it reports in the Woodpecker admin UI).
#   - The agent host already has: Xcode Command Line Tools, rustup (with the
#     x86_64-apple-darwin and aarch64-apple-darwin targets installable),
#     git, curl, and jq (`brew install jq`). None of that is installed by
#     this pipeline — unlike the Docker-based Linux pipeline, there's no
#     ephemeral image to provision it into.
# Expect to fix step syntax once you've actually registered the agent.

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

platform: darwin/arm64

steps:
  - name: build
    environment:
      CARGO_TERM_COLOR: "always"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    commands:
      - set -eux
      - |
        # Release tags must point to a commit on main (same guard as the
        # original GH Actions build-release job).
        git fetch origin main
        git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
          echo "Release tags must point to a commit on main."
          exit 1
        }
      - rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - cargo build --release --locked --target aarch64-apple-darwin
      - strip target/aarch64-apple-darwin/release/gguf-switchboard || true
      - cp target/aarch64-apple-darwin/release/gguf-switchboard gguf-switchboard-darwin-arm64

      - cargo build --release --locked --target x86_64-apple-darwin
      - strip target/x86_64-apple-darwin/release/gguf-switchboard || true
      - cp target/x86_64-apple-darwin/release/gguf-switchboard gguf-switchboard-darwin-amd64

      - shasum -a 256 gguf-switchboard-darwin-arm64 gguf-switchboard-darwin-amd64 > checksums-darwin.txt

  - name: publish-release
    depends_on: [build]
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      GITHUB_REPO: pradeepgudipati/gguf-switchboard
    commands:
      - |
        set -eux
        TAG="${CI_COMMIT_TAG:?this pipeline expects a tag event}"

        HTTP_CODE="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${TAG}")"

        if [ "$HTTP_CODE" = "404" ]; then
          BODY="$(cat "releases/${TAG}.md" 2>/dev/null || echo "Release ${TAG}")"
          if ! curl -sS -f -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPO}/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" '{tag_name:$tag, body:$body}')" \
            -o /tmp/release.json; then
            # Lost the create race to release-linux.yml — the release exists now.
            curl -sS -f -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${TAG}" -o /tmp/release.json
          fi
        elif [ "$HTTP_CODE" != "200" ]; then
          echo "Unexpected response ($HTTP_CODE) checking for existing release"; cat /tmp/release.json; exit 1
        fi

        UPLOAD_URL="$(jq -r '.upload_url' /tmp/release.json | sed 's/{?name,label}//')"
        for f in gguf-switchboard-darwin-arm64 gguf-switchboard-darwin-amd64 checksums-darwin.txt; do
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${f}" \
            "${UPLOAD_URL}?name=${f}"
        done
