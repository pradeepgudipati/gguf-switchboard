name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the information below to help us investigate.

  - type: input
    id: version
    attributes:
      label: GGUF Switchboard Version
      description: Output of `ggs version` or `cargo build --release` version
      placeholder: "0.1.7"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Other)
        - macOS
        - Windows (WSL2)
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      description: CPU model and core count
      placeholder: "AMD Ryzen 9 5900X 12-Core"
    validations:
      required: false

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: GPU model and VRAM
      placeholder: "NVIDIA RTX 4090 24GB"
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: System RAM
      description: Total system RAM
      placeholder: "64GB"
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Model
      description: Model name and format (GGUF or SafeTensors)
      placeholder: "Qwen3.5-9B-GGUF Q4_K_M"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - llama.cpp (GGUF)
        - vLLM (SafeTensors)
        - Both
        - Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start GGUF Switchboard with...
        2. Send request to...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant log output (ggs logs or cargo run output)
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant parts of config.toml and models.toml
      render: toml
    validations:
      required: false

  - type: textarea
    id: nvidia-smi
    attributes:
      label: nvidia-smi Output
      description: Output of `nvidia-smi` showing GPU state
      render: shell
    validations:
      required: false
