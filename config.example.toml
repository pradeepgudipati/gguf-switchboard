# GGUF Switchboard configuration
# See README.md for full documentation.

# Address to bind the HTTP server
bind = "0.0.0.0:9090"

# Maximum seconds to wait for a backend to become healthy
startup_timeout = 60

# Seconds of idle time before the priority model auto-loads
idle_timeout = 600

# Default backend engine
default_backend = "llama.cpp"

# Assumed GPU capacity in GB — heuristic for per-model context (-c) when not set in models.toml.
# RTX 3060 = 12; also used as VRAM fallback when auto_ngl cannot query nvidia-smi.
vram_gb = 12

# When true, pick -ngl at load from free VRAM (nvidia-smi or vram_gb) and GGUF size.
# Manual [[models]].ngl or -ngl in extra_args still wins. Default keeps ngl = 999.
auto_ngl = false

# Seconds to wait for in-flight requests before switching models
switch_drain_timeout_secs = 120

# Seconds to skip priority-model reload after a failed load
priority_load_cooldown_secs = 300

# Seconds between automatic model-directory rescans (86400 = daily). Set 0 to disable.
models_rescan_interval_secs = 86400

# Path to token usage SQLite database (defaults to token_usage.db)
database_path = "/var/lib/gguf-switchboard/usage.db"

# ─── ModelFitPlanner ─────────────────────────────────────────────────────────
# When enabled, the planner inspects GPU topology / free VRAM, model metadata,
# and requested context before every load, then produces a safe launch profile.
# On OOM it advances through a bounded fallback ladder instead of blindly retrying.
[fit]
enabled = false
# Safety headroom subtracted from free VRAM when planning (MB).
vram_reserve_mb = 2048
# Multi-GPU strategy: "auto" detects GPUs and computes tensor-split from free VRAM.
multi_gpu = "auto"
# Split mode for multi-GPU: "layer" (recommended), "row", or "none".
split_mode = "layer"
# Maximum load attempts before giving up (default 5).
max_attempts = 5
# Persist successful profiles to /var/lib/gguf-switchboard/model-profiles.json
# so subsequent loads skip the fallback ladder entirely.
cache_profiles = true

# ─── Models ───────────────────────────────────────────────────────────────────
# Models are defined in models.toml using short aliases.
# deploy.sh writes an absolute path so the unit does not depend on cwd.
# Manual / local: models_file = "models.toml" next to this file also works.
models_file = "/opt/gguf-switchboard/models.toml"